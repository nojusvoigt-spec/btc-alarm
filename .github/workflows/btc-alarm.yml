name: BTC-Alarm

# Prueft alle 5 Minuten (2 Min. nach jedem 15m-Kerzenschluss) wie der Indikator "LR Zones"
# und schickt LONG (Sellers >= 90 %) oder SHORT (Buyers >= 90 %) per ntfy aufs iPhone.
# "Run workflow" von Hand schickt eine Test-Mitteilung.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-alarm

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: BTC pruefen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
        run: |
          python3 - $MODE <<'EOF'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone
          try:
              from zoneinfo import ZoneInfo
              TZ = ZoneInfo("Europe/Berlin")
          except Exception:
              TZ = timezone.utc

          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()
          LOOKBACK = 400      # wie "Range lookback (bars)"
          STEP = 900          # 15-Minuten-Kerzen
          THRESHOLD = 90.0    # wie "Extreme percentage"
          RECENT_BARS = 4     # Signale der letzten Stunde melden, falls GitHub spaet startet
          HEADERS = {"User-Agent": "btc-alarm/1.0"}

          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=HEADERS), timeout=20) as r:
                  return r.read().decode()

          def closed_candles():
              data = json.loads(get(f"https://www.bitstamp.net/api/v2/ohlc/btcusd/?step={STEP}&limit=1000"))
              candles = sorted(
                  ({"t": int(c["timestamp"]), "h": float(c["high"]), "l": float(c["low"]), "c": float(c["close"])}
                   for c in data["data"]["ohlc"]),
                  key=lambda c: c["t"],
              )
              now = time.time()
              return [c for c in candles if c["t"] + STEP <= now]

          def evaluate(candles):
              """Pro Kerze dasselbe wie im Pine-Skript: Buyers/Sellers % und Eintritt ins Extrem."""
              rows = []
              prev_buy = prev_sell = False
              for i in range(LOOKBACK - 1, len(candles)):
                  win = candles[i - LOOKBACK + 1:i + 1]
                  hi, lo = max(c["h"] for c in win), min(c["l"] for c in win)
                  hc, lc = max(c["c"] for c in win), min(c["c"] for c in win)
                  buyers = sellers = None
                  buy_ext = sell_ext = False
                  if hi - lo > 0 and hc - lc > 0:
                      buyers = max(0.0, min(100.0, 100.0 * (candles[i]["c"] - lc) / (hc - lc)))
                      sellers = 100.0 - buyers
                      buy_ext, sell_ext = buyers >= THRESHOLD, sellers >= THRESHOLD
                  rows.append({
                      "candle": candles[i], "buyers": buyers, "sellers": sellers,
                      "long": sell_ext and not prev_sell,
                      "short": buy_ext and not prev_buy,
                  })
                  prev_buy, prev_sell = buy_ext, sell_ext
              return rows

          def already_sent():
              lines = get(f"https://ntfy.sh/{TOPIC}/json?poll=1&since=12h").splitlines()
              msgs = (json.loads(line) for line in lines if line.strip())
              return {(m.get("title"), m.get("message")) for m in msgs if m.get("event") == "message"}

          def notify(title, body, tag):
              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}", data=body.encode(),
                  headers={**HEADERS, "Title": title, "Tags": tag, "Priority": "high"},
              )
              urllib.request.urlopen(req, timeout=20).read()
              print(f"gesendet: {title} | {body}")

          def describe(row, side):
              c = row["candle"]
              when = datetime.fromtimestamp(c["t"], TZ).strftime("%d.%m. %H:%M")
              price = f"{c['c']:,.0f}".replace(",", ".")
              return f"{side} {row[side.lower()]:.1f}% | 15m-Kerze {when} | Preis {price} $"

          rows = evaluate(closed_candles())
          last = rows[-1]
          print(f"Letzte 15m-Kerze {datetime.fromtimestamp(last['candle']['t'], TZ):%d.%m. %H:%M}: "
                f"Buyers {last['buyers']:.1f}% | Sellers {last['sellers']:.1f}%")
          if "--status" in sys.argv:
              sys.exit()
          if not TOPIC:
              sys.exit("Secret NTFY_TOPIC fehlt: Settings > Secrets and variables > Actions")
          if "--test" in sys.argv:
              notify("BTC-Alarm", "Test: Mitteilungen funktionieren ✅", "white_check_mark")
              sys.exit()

          sent = already_sent()
          for row in rows[-RECENT_BARS:]:
              for flag, title, side, tag in (("long", "LONG BTC", "Sellers", "green_circle"),
                                             ("short", "SHORT BTC", "Buyers", "red_circle")):
                  if row[flag]:
                      body = describe(row, side)
                      if (title, body) not in sent:
                          notify(title, body, tag)
          EOF

      # GitHub pausiert Zeitplaene nach 60 Tagen ohne Aenderung. Alle 30 Tage ein leerer Commit verhindert das.
      - name: Zeitplan aktiv halten
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
